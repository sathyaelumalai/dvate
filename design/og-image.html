<!doctype html>
<!--
  Source for public/og-image.png (1200 x 630). To re-export, open this file in Chrome at
  1200 x 630 (DevTools device toolbar) and capture a screenshot, or run the steps in
  design/README.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Geist Variable'; font-weight: 100 900; src: url(../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format('woff2-variations'); }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden;
    display: grid; grid-template-columns: 1fr 400px; align-items: center; gap: 48px;
    padding: 0 72px 0 80px;
    background:
      radial-gradient(700px 500px at 85% 20%, rgba(31, 181, 234, 0.28), transparent 65%),
      radial-gradient(500px 400px at 70% 100%, rgba(229, 50, 45, 0.18), transparent 65%),
      #071528;
    color: #fff; font-family: 'Geist Variable', sans-serif;
  }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05); font-size: 22px; font-weight: 500; color: #c9d7e8; }
  .eyebrow i { width: 10px; height: 10px; border-radius: 50%; background: #E5322D; }
  h1 { font-size: 62px; font-weight: 650; line-height: 1.02; letter-spacing: -0.045em; margin: 30px 0 26px; max-width: 13ch; }
  p { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; color: #9fb6d1; }
  .disc { width: 400px; height: 400px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 40px 90px -30px rgba(0,0,0,.7), 0 0 0 10px rgba(255,255,255,.06); }
  .disc img { width: 300px; height: 300px; object-fit: contain; }
</style>
</head>
<body>
  <div>
    <span class="eyebrow"><i></i>High-level care, brought to the bedside</span>
    <h1>Vascular access, transfusion and infusion care at the bedside.</h1>
    <p>No transport. No disruption. No exposure.</p>
  </div>
  <div class="disc"><img src="../public/img/brand/dvate-logo.png" alt=""></div>
</body>
</html>
